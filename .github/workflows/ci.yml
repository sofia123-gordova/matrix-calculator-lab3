name: Matrix Calculator CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake libgtest-dev doxygen graphviz valgrind

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j2

      - name: Run tests
        run: ctest --test-dir build --verbose --output-on-failure

      - name: Check memory
        run: valgrind --leak-check=full --show-leak-kinds=all --error-exitcode=1 ./build/tests/matrix_tests

      - name: Generate documentation
        run: doxygen Doxyfile

      - name: Save documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/html
          if-no-files-found: error

      - name: Build Docker image
        run: docker build -t matrix-calculator .

      - name: Run Docker container
        run: docker run --rm matrix-calculator